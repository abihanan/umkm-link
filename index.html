<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopi Pilgrim</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @custom-variant dark (&:where(.dark, .dark *));

        @theme {
            --font-display: Georgia, "Times New Roman", serif;

            --color-mist-100: #eeeeee;
            --color-aqua-200: #b9e4e8;
            --color-sea-600: #167d8d;
            --color-sea-700: #0f6572;
            --color-ink-950: #071b2b;
            --color-ink-900: #0d2a3d;
            --color-ink-800: #173f55;
            --color-ink-500: #4a606c;
            --color-ink-300: #9cc0c8;
        }
    </style>
    <script>
        try {
            const savedTheme = localStorage.getItem("umkm:theme");
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

            if (savedTheme === "dark" || (savedTheme === null && prefersDark)) {
                document.documentElement.classList.add("dark");
            }
        } catch (error) {
        }
    </script>
</head>
<body class="min-h-screen bg-mist-100 text-ink-950 dark:bg-ink-950 dark:text-mist-100">

<button id="theme-toggle" type="button" data-action="toggle-theme" aria-label="Ganti ke mode gelap"
        class="fixed right-4 top-4 z-10 flex h-11 w-11 items-center justify-center rounded-full bg-white text-ink-950 ring-1 ring-aqua-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sea-600 dark:bg-ink-900 dark:text-mist-100 dark:ring-ink-800 dark:focus-visible:outline-aqua-200"></button>

<div class="mx-auto max-w-md px-4 pb-28 pt-10 md:max-w-2xl md:pt-16 lg:grid lg:max-w-5xl lg:grid-cols-[320px_1fr] lg:items-start lg:gap-12">

    <aside class="lg:sticky lg:top-16">
        <header id="store-header"></header>
        <nav id="store-links" aria-label="Tautan toko" class="mt-6"></nav>
        <section id="store-hours" aria-labelledby="hours-heading" class="mt-8"></section>
    </aside>

    <main class="mt-10 lg:mt-0">
        <h2 class="font-display text-2xl">Menu</h2>
        <div id="filter-tabs" role="group" aria-label="Filter kategori"
             class="-mx-4 mt-1 flex gap-2 overflow-x-auto px-4 py-2 lg:mx-0 lg:flex-wrap lg:px-0"></div>
        <div id="product-grid" class="mt-4 grid grid-cols-2 gap-3 md:grid-cols-3"></div>
    </main>

    <footer class="mt-12 text-center text-xs text-ink-500 dark:text-ink-300 lg:col-span-2">
        <p>&copy; 2026 Kopi Pilgrim.</p>
    </footer>
</div>

<div id="cart-bar"></div>

<dialog id="cart-dialog" aria-labelledby="cart-title"
        class="m-auto w-[min(28rem,calc(100%-2rem))] rounded-2xl bg-white p-0 text-ink-950 shadow-xl backdrop:bg-black/50 dark:bg-ink-900 dark:text-mist-100">
    <div id="cart-content" class="p-5"></div>
</dialog>

<dialog id="payment-dialog" aria-labelledby="payment-title"
        class="m-auto w-[min(28rem,calc(100%-2rem))] rounded-2xl bg-white p-0 text-ink-950 shadow-xl backdrop:bg-black/50 dark:bg-ink-900 dark:text-mist-100">
    <div id="payment-content" class="p-5"></div>
</dialog>

<script src="data.js"></script>
<script src="scripts.js"></script>
</body>
</html>
